<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>{% block title %}remna-orchestrator{% endblock %}</title>
  <script src="https://unpkg.com/htmx.org@2.0.3"></script>
  <style>
    :root {
      --bg: #0b1020;
      --surface: #151c33;
      --surface-2: #1d2542;
      --text: #e6e8f2;
      --muted: #9aa1bf;
      --accent: #4f9cff;
      --ok: #31c48d;
      --warn: #f5b544;
      --err: #ff5470;
      --border: #2a3258;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    header {
      padding: 14px 24px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--surface);
    }
    header h1 { font-size: 1.1rem; margin: 0; }
    header a { color: var(--muted); text-decoration: none; margin-left: 14px; font-size: .9rem; }
    header a:hover { color: var(--text); }
    main { padding: 24px; max-width: 1200px; margin: 0 auto; }
    h2 { font-size: 1rem; text-transform: uppercase; color: var(--muted); letter-spacing: 1px; }
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 16px; margin-bottom: 24px; }
    table { width: 100%; border-collapse: collapse; }
    th, td { padding: 8px 12px; text-align: left; border-bottom: 1px solid var(--border); font-size: .9rem; }
    th { color: var(--muted); font-weight: 500; font-size: .8rem; text-transform: uppercase; letter-spacing: .5px; }
    .badge { padding: 2px 8px; border-radius: 4px; font-size: .75rem; font-weight: 600; }
    .badge-active { background: rgba(49, 196, 141, .18); color: var(--ok); }
    .badge-provisioning { background: rgba(79, 156, 255, .18); color: var(--accent); }
    .badge-standby { background: rgba(245, 181, 68, .18); color: var(--warn); }
    .badge-blocked, .badge-disabled, .badge-destroyed { background: rgba(255, 84, 112, .18); color: var(--err); }
    button, .btn {
      background: var(--accent);
      color: white;
      border: none;
      padding: 6px 12px;
      border-radius: 4px;
      font-size: .85rem;
      cursor: pointer;
      margin-right: 4px;
      text-decoration: none;
      display: inline-block;
    }
    button:hover { filter: brightness(1.1); }
    button.danger { background: var(--err); }
    button.ghost { background: transparent; border: 1px solid var(--border); color: var(--text); }
    input[type=text], input[type=password] {
      width: 100%;
      padding: 8px 12px;
      border-radius: 4px;
      border: 1px solid var(--border);
      background: var(--surface-2);
      color: var(--text);
      font-size: .95rem;
    }
    .actions { display: flex; gap: 4px; }
    .flash { padding: 10px 14px; margin-bottom: 16px; border-radius: 6px; font-size: .9rem; }
    .flash-err { background: rgba(255, 84, 112, .15); color: var(--err); }
    .flash-ok { background: rgba(49, 196, 141, .15); color: var(--ok); }
    code { background: var(--surface-2); padding: 2px 6px; border-radius: 3px; font-size: .85rem; }
  </style>
</head>
<body>
  <header>
    <h1>remna-orchestrator</h1>
    <nav>
      {% if request.session.get('authed') %}
        <a href="/ui/">Dashboard</a>
        <a href="/docs">API docs</a>
        <a href="/ui/logout">Logout</a>
      {% endif %}
    </nav>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
